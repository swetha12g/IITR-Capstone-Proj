apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: pipelinefortress
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: juice-shop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: juice-shop
        app.kubernetes.io/part-of: pipelinefortress
    spec:
      serviceAccountName: juice-shop
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: juice-shop
          # Local kind import manifest reference, not a published registry image.
          image: docker.io/library/pipelinefortress@sha256:77f2b09d4c678186e64caafef22ec929a01f4211a1e12d67b28d97e008707549
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 768Mi
              ephemeral-storage: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - {name: data, mountPath: /juice-shop/data}
            - {name: ftp, mountPath: /juice-shop/ftp}
            - {name: i18n, mountPath: /juice-shop/i18n}
            - {name: frontend, mountPath: /juice-shop/frontend/dist}
            - {name: uploads, mountPath: /juice-shop/uploads}
            - {name: logs, mountPath: /juice-shop/logs}
            - {name: well-known, mountPath: /juice-shop/.well-known}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 128Mi}
        - name: ftp
          emptyDir: {sizeLimit: 32Mi}
        - name: i18n
          emptyDir: {sizeLimit: 32Mi}
        - name: frontend
          emptyDir: {sizeLimit: 128Mi}
        - name: uploads
          emptyDir: {sizeLimit: 64Mi}
        - name: logs
          emptyDir: {sizeLimit: 32Mi}
        - name: well-known
          emptyDir: {sizeLimit: 16Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
